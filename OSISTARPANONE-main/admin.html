<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== LOCK SCREEN (PIN) ===== -->
    <div id="lockScreen" class="lock-screen">
        <div class="lock-card">
            <div class="lock-logo">🔐</div>
            <h2>Admin OSIS</h2>
            <p>Masukkan PIN untuk masuk</p>
            <input type="password" id="pinInput" class="lock-input" placeholder="PIN Admin" maxlength="20" autocomplete="off">
            <button class="btn-admin btn-red" onclick="masukAdmin()">Masuk</button>
            <div id="pinError" class="lock-error"></div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboard" class="dashboard" style="display: none;">

        <header class="admin-topbar">
            <div class="admin-brand">
                <span class="admin-brand-icon">⚙️</span>
                <div>
                    <h2>Panel Admin OSIS</h2>
                    <p>Kelola data & foto website OSIS Tarpan One</p>
                </div>
            </div>
            <button class="btn-admin btn-ghost" onclick="keluarAdmin()">Keluar</button>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn active" data-tab="tabPimpinan" onclick="pindahTab('tabPimpinan', this)">👑 Pimpinan</button>
            <button class="tab-btn" data-tab="tabAnggota" onclick="pindahTab('tabAnggota', this)">👥 Anggota</button>
            <button class="tab-btn" data-tab="tabSekbid" onclick="pindahTab('tabSekbid', this)">🗂️ Sekbid</button>
            <button class="tab-btn" data-tab="tabFoto" onclick="pindahTab('tabFoto', this)">🖼️ Foto Web</button>
            <button class="tab-btn" data-tab="tabSetting" onclick="pindahTab('tabSetting', this)">⚙️ Pengaturan</button>
        </nav>

        <main class="admin-main">

            <!-- ===== TAB PIMPINAN ===== -->
            <section id="tabPimpinan" class="tab-panel active">
                <div class="panel-head">
                    <h3>Ketua & Wakil per Tahun</h3>
                    <div class="year-picker">
                        <select id="pilihTahunPimpinan" class="admin-select" onchange="muatPimpinan()"></select>
                    </div>
                </div>

                <div class="form-card">
                    <div class="form-grid-2">
                        <div>
                            <label>Nama Ketua OSIS</label>
                            <input type="text" id="pimpinanKetuaNama" class="admin-input" placeholder="Nama ketua">
                            <label>Foto Ketua</label>
                            <input type="file" id="pimpinanKetuaFile" class="admin-file" accept="image/*">
                            <div class="foto-preview-row">
                                <img id="previewKetua" class="foto-preview" alt="Preview ketua">
                                <button class="btn-admin btn-small" onclick="uploadFotoPimpinan('ketua')">⬆️ Upload Foto</button>
                            </div>
                        </div>
                        <div>
                            <label>Nama Wakil Ketua</label>
                            <input type="text" id="pimpinanWakilNama" class="admin-input" placeholder="Nama wakil">
                            <label>Foto Wakil</label>
                            <input type="file" id="pimpinanWakilFile" class="admin-file" accept="image/*">
                            <div class="foto-preview-row">
                                <img id="previewWakil" class="foto-preview" alt="Preview wakil">
                                <button class="btn-admin btn-small" onclick="uploadFotoPimpinan('wakil')">⬆️ Upload Foto</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-grid-2">
                        <div>
                            <label>Foto Angkatan (grid tahun)</label>
                            <input type="file" id="pimpinanAngkatanFile" class="admin-file" accept="image/*">
                            <div class="foto-preview-row">
                                <img id="previewAngkatan" class="foto-preview" alt="Preview angkatan">
                                <button class="btn-admin btn-small" onclick="uploadFotoPimpinan('angkatan')">⬆️ Upload Foto</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button class="btn-admin btn-red" onclick="simpanPimpinan()">💾 Simpan Data</button>
                    </div>
                </div>
            </section>

            <!-- ===== TAB ANGGOTA ===== -->
            <section id="tabAnggota" class="tab-panel">
                <div class="panel-head">
                    <h3>Anggota per Tahun</h3>
                    <select id="pilihTahunAnggota" class="admin-select" onchange="muatAnggota()"></select>
                </div>

                <div class="form-card form-card-add">
                    <div class="form-grid-3">
                        <input type="text" id="anggotaBaruNama" class="admin-input" placeholder="Nama anggota baru">
                        <input type="text" id="anggotaBaruJabatan" class="admin-input" placeholder="Jabatan (cth: Kerohanian)">
                        <input type="number" id="anggotaBaruUrutan" class="admin-input" placeholder="Urutan (cth: 15)" value="15">
                    </div>
                    <div class="form-actions">
                        <button class="btn-admin btn-red" onclick="tambahAnggotaBaru()">➕ Tambah Anggota</button>
                    </div>
                </div>

                <div id="listAnggotaAdmin" class="anggota-list"></div>
            </section>

            <!-- ===== TAB SEKBID ===== -->
            <section id="tabSekbid" class="tab-panel">
                <div class="panel-head">
                    <h3>Seksi Bidang & BPH</h3>
                </div>

                <div class="form-card form-card-add">
                    <div class="form-grid-3">
                        <select id="sekbidBaruKategori" class="admin-select">
                            <option value="BPH">BPH</option>
                            <option value="SEKBID">SEKBID</option>
                        </select>
                        <input type="text" id="sekbidBaruNama" class="admin-input" placeholder="Nama (cth: Kerohanian)">
                        <input type="text" id="sekbidBaruIcon" class="admin-input" placeholder="Icon emoji (cth: 🕌)" maxlength="8">
                    </div>
                    <textarea id="sekbidBaruDeskripsi" class="admin-textarea" placeholder="Deskripsi / tugas pokok"></textarea>
                    <div class="form-actions">
                        <button class="btn-admin btn-red" onclick="tambahSekbidBaru()">➕ Tambah Sekbid</button>
                    </div>
                </div>

                <div id="listSekbidAdmin" class="sekbid-list"></div>
            </section>

            <!-- ===== TAB FOTO WEB ===== -->
            <section id="tabFoto" class="tab-panel">
                <div class="panel-head">
                    <h3>Foto Halaman Web</h3>
                    <p class="panel-sub">Ganti foto yang muncul di website. Kosongkan = pakai default.</p>
                </div>
                <div id="gridFotoWeb" class="foto-web-grid"></div>
            </section>

            <!-- ===== TAB PENGATURAN ===== -->
            <section id="tabSetting" class="tab-panel">
                <div class="panel-head">
                    <h3>Pengaturan</h3>
                </div>

                <div class="form-card">
                    <label>PIN Admin</label>
                    <div class="form-grid-2">
                        <input type="text" id="pinAdminBaru" class="admin-input" placeholder="PIN baru">
                        <button class="btn-admin btn-red" onclick="gantiPin()">🔑 Ganti PIN</button>
                    </div>
                </div>

                <div class="form-card">
                    <label>Kotak Aspirasi</label>
                    <div class="form-grid-2">
                        <select id="statusAspirasiSelect" class="admin-select">
                            <option value="BUKA">Buka</option>
                            <option value="TUTUP">Tutup</option>
                        </select>
                        <button class="btn-admin btn-red" onclick="gantiStatusAspirasi()">💾 Simpan Status</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
