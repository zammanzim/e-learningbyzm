<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — OSIS TARPAN ONE</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

    <!-- ===== LOCK SCREEN ===== -->
    <div class="lock-screen" id="lockScreen">
        <div class="lock-card">
            <div class="lock-logo">🔐</div>
            <h2>Admin OSIS</h2>
            <p>Masukkan PIN untuk masuk panel admin</p>
            <input type="password" id="pinInput" class="admin-input" placeholder="PIN Admin" maxlength="20" autocomplete="off">
            <button class="btn btn-red btn-block" data-action="auth.masuk">Masuk</button>
            <div class="lock-error" id="pinError"></div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div class="admin-dash" id="dashboard" style="display: none;">

        <header class="admin-topbar">
            <div class="brand">
                <div class="logo-box">
                    <img data-foto="logo1" alt="Logo">
                </div>
                <div class="brand-text">
                    <h2>PANEL ADMIN</h2>
                    <p>Kelola data & foto OSIS</p>
                </div>
            </div>
            <button class="btn btn-white btn-sm" data-action="auth.keluar">Keluar</button>
        </header>

        <nav class="admin-tabs">
            <button class="tab-btn active" data-tab="tabPimpinan">👑 Pimpinan</button>
            <button class="tab-btn" data-tab="tabAnggota">👥 Anggota</button>
            <button class="tab-btn" data-tab="tabSekbid">🗂️ Sekbid</button>
            <button class="tab-btn" data-tab="tabFoto">🖼️ Foto Web</button>
            <button class="tab-btn" data-tab="tabSetting">⚙️ Pengaturan</button>
        </nav>

        <main class="admin-main">

            <!-- ===== PIMPINAN ===== -->
            <section class="tab-panel active" id="tabPimpinan">
                <div class="panel-head">
                    <h3>Ketua & Wakil per Tahun</h3>
                    <select class="admin-input" id="pilihTahunPimpinan" style="max-width: 150px;"></select>
                </div>

                <div class="admin-card">
                    <div class="vm-grid">
                        <div>
                            <label class="lbl">Nama Ketua OSIS</label>
                            <input type="text" class="admin-input" id="pimpinanKetuaNama" placeholder="Nama ketua">
                            <label class="lbl">Foto Ketua</label>
                            <input type="file" class="admin-input" id="pimpinanKetuaFile" accept="image/*">
                            <div class="foto-row">
                                <img id="previewKetua" class="foto-prev" alt="">
                                <button class="btn btn-red btn-sm" data-action="pimpinan.upload" data-slot="ketua">⬆️ Upload</button>
                            </div>
                        </div>
                        <div>
                            <label class="lbl">Nama Wakil Ketua</label>
                            <input type="text" class="admin-input" id="pimpinanWakilNama" placeholder="Nama wakil">
                            <label class="lbl">Foto Wakil</label>
                            <input type="file" class="admin-input" id="pimpinanWakilFile" accept="image/*">
                            <div class="foto-row">
                                <img id="previewWakil" class="foto-prev" alt="">
                                <button class="btn btn-red btn-sm" data-action="pimpinan.upload" data-slot="wakil">⬆️ Upload</button>
                            </div>
                        </div>
                    </div>

                    <label class="lbl" style="margin-top: 14px;">Foto Angkatan (grid tahun)</label>
                    <input type="file" class="admin-input" id="pimpinanAngkatanFile" accept="image/*">
                    <div class="foto-row">
                        <img id="previewAngkatan" class="foto-prev" alt="">
                        <button class="btn btn-red btn-sm" data-action="pimpinan.upload" data-slot="angkatan">⬆️ Upload</button>
                    </div>

                    <div class="form-actions">
                        <button class="btn btn-dark" data-action="pimpinan.simpan">💾 Simpan Data</button>
                    </div>
                </div>
            </section>

            <!-- ===== ANGGOTA ===== -->
            <section class="tab-panel" id="tabAnggota">
                <div class="panel-head">
                    <h3>Anggota per Tahun</h3>
                    <select class="admin-input" id="pilihTahunAnggota" style="max-width: 150px;"></select>
                </div>

                <div class="admin-card">
                    <div class="vm-grid">
                        <input type="text" class="admin-input" id="anggotaBaruNama" placeholder="Nama anggota baru">
                        <input type="text" class="admin-input" id="anggotaBaruJabatan" placeholder="Jabatan (cth: Kerohanian)">
                        <input type="number" class="admin-input" id="anggotaBaruUrutan" placeholder="Urutan" value="15">
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-red" data-action="anggota.tambah">➕ Tambah Anggota</button>
                    </div>
                </div>

                <div id="listAnggota"></div>
            </section>

            <!-- ===== SEKBID ===== -->
            <section class="tab-panel" id="tabSekbid">
                <div class="panel-head">
                    <h3>Seksi Bidang & BPH</h3>
                </div>

                <div class="admin-card">
                    <div class="vm-grid">
                        <select class="admin-input" id="sekbidBaruKategori">
                            <option value="BPH">BPH</option>
                            <option value="SEKBID">SEKBID</option>
                        </select>
                        <input type="text" class="admin-input" id="sekbidBaruNama" placeholder="Nama (cth: Kerohanian)">
                        <input type="text" class="admin-input" id="sekbidBaruIcon" placeholder="Emoji (cth: 🕌)" maxlength="8">
                    </div>
                    <textarea class="admin-input admin-textarea" id="sekbidBaruDeskripsi" placeholder="Deskripsi / tugas pokok"></textarea>
                    <div class="form-actions">
                        <button class="btn btn-red" data-action="sekbid.tambah">➕ Tambah Sekbid</button>
                    </div>
                </div>

                <div id="listSekbid"></div>
            </section>

            <!-- ===== FOTO WEB ===== -->
            <section class="tab-panel" id="tabFoto">
                <div class="panel-head">
                    <h3>Foto Halaman Web</h3>
                    <p style="font-size: 0.75rem; color: var(--gray); font-weight: 600;">Ganti foto yang muncul di website. Reset = kembali ke default.</p>
                </div>
                <div id="gridFotoWeb" class="foto-web-grid"></div>
            </section>

            <!-- ===== PENGATURAN ===== -->
            <section class="tab-panel" id="tabSetting">
                <div class="panel-head">
                    <h3>Pengaturan</h3>
                </div>

                <div class="admin-card">
                    <label class="lbl">PIN Admin</label>
                    <div class="vm-grid">
                        <input type="text" class="admin-input" id="pinAdminBaru" placeholder="PIN baru (min 4 karakter)">
                        <button class="btn btn-red" data-action="setting.gantiPin">🔑 Ganti PIN</button>
                    </div>
                </div>

                <div class="admin-card">
                    <label class="lbl">Kotak Aspirasi</label>
                    <div class="vm-grid">
                        <select class="admin-input" id="statusAspirasiSelect">
                            <option value="BUKA">Buka</option>
                            <option value="TUTUP">Tutup</option>
                        </select>
                        <button class="btn btn-red" data-action="setting.gantiStatus">💾 Simpan Status</button>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/admin.js" defer></script>
</body>
</html>
